name: AI Trader - Scheduled Execution

on:
  schedule:
    # Run every weekday at 9:00 AM EST (14:00 UTC)
    # Adjust time based on your trading strategy
    - cron: '0 14 * * 1-5'
  
  # Allow manual triggering
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create credentials file
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json
      
      - name: Run trading assistant
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          PORTFOLIO_ALLOCATION: ${{ secrets.PORTFOLIO_ALLOCATION }}
        run: |
          python main.py
      
      - name: Clean up credentials
        if: always()
        run: |
          rm -f credentials.json
